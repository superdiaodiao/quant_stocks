name: runner network probe (temporary)

# Temporary: can a GitHub-hosted runner reach the data sources v50r3 uses
# (Nasdaq's public API and SEC EDGAR) at the rate a SIGNAL staging needs?
# Runs only when this file changes on the development branch.

on:
  push:
    branches: [dev/kind-pasteur-7fa25i]
    paths: [.github/workflows/runner_network_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Probe Nasdaq and SEC from this runner
      run: |
        PYTHONPATH=. python - <<'PY'
        import json
        import time
        from concurrent.futures import ThreadPoolExecutor
        from datetime import date, datetime, timedelta, timezone
        from urllib.parse import urlencode
        from urllib.request import Request, urlopen

        import pandas as pd

        from scripts.research_v5_trend_core_satellite import _nasdaq_dividend_history
        from src.io import nasdaq_update as n
        from src.io.financial_update import SEC_FACTS_API, SEC_HEADERS, SEC_TICKERS_API
        from src.research import prospective_schedule as schedule

        report = {"runner_utc": datetime.now(timezone.utc).isoformat(timespec="seconds")}
        session = schedule.latest_completed_session(datetime.now(timezone.utc))
        report["latest_session"] = f"{session:%Y-%m-%d}"
        end = session.date()


        def probe(label, function):
            started = time.monotonic()
            try:
                result = function()
                report[label] = {"ok": True, **result}
            except Exception as exc:
                report[label] = {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:300]}
            report[label]["seconds"] = round(time.monotonic() - started, 1)
            return report[label]


        symbols = []


        def screener():
            params = urlencode({"tableonly": "true", "limit": 10000, "exchange": "nasdaq"})
            request = Request(n.uncached(n.SCREENER_API + "?" + params), headers=n.HEADERS)
            with urlopen(request, timeout=60) as response:
                rows = json.load(response)["data"]["table"]["rows"]
            symbols.extend(str(row["symbol"]).strip().upper() for row in rows)
            return {"rows": len(rows)}


        probe("nasdaq_screener", screener)
        sample = symbols[:: max(1, len(symbols) // 200)][:200] or ["AAPL", "MSFT"]


        def history_batch():
            def one(symbol):
                try:
                    frame = n.fetch_history(symbol, end - timedelta(days=10), end, retries=2)
                    if frame.empty:
                        return "empty"
                    latest = pd.Timestamp(frame["date"].max()).date()
                    return "current" if latest == end else "stale"
                except Exception:
                    return "failed"

            with ThreadPoolExecutor(max_workers=16) as pool:
                outcomes = list(pool.map(one, sample))
            return {"requested": len(sample), **pd.Series(outcomes).value_counts().to_dict()}


        probe("nasdaq_history_200_stocks_16_workers", history_batch)
        probe("composite_history", lambda: {"rows": len(n.fetch_history(
            "COMP", end - timedelta(days=30), end, asset_class="index"))})
        probe("qqq_history", lambda: {"rows": len(n.fetch_history(
            "QQQ", date(2018, 1, 1), end, asset_class="etf"))})
        probe("qqq_dividends", lambda: {"rows": len(_nasdaq_dividend_history()[1])})
        probe("composite_official_close", lambda: {
            "close": n.fetch_closed_index_snapshot("COMP", end).get("close")})


        def raw_single_day():
            params = urlencode({"assetclass": "stocks", "fromdate": end.isoformat(),
                                "todate": end.isoformat(), "limit": 5000})
            request = Request(n.uncached(n.API.format(symbol="AAPL") + "?" + params),
                              headers=n.HEADERS)
            with urlopen(request, timeout=30) as response:
                rows = ((json.load(response).get("data") or {}).get("tradesTable") or {}).get("rows") or []
            fixed = n.fetch_history("AAPL", end, end)
            return {"raw_rows": len(rows), "fixed_rows": len(fixed)}


        probe("single_day_range", raw_single_day)
        ciks = {}


        def sec_ticker_map():
            with urlopen(Request(SEC_TICKERS_API, headers=SEC_HEADERS), timeout=60) as response:
                payload = json.load(response)
            for row in payload.values():
                ciks.setdefault(str(row["ticker"]).upper(), int(row["cik_str"]))
            return {"tickers": len(ciks)}


        probe("sec_ticker_map", sec_ticker_map)


        def sec_companyfacts():
            chosen = [ciks[s] for s in sample if s in ciks][:20]
            outcomes = []
            for cik in chosen:
                try:
                    with urlopen(Request(SEC_FACTS_API.format(cik=cik), headers=SEC_HEADERS),
                                 timeout=45) as response:
                        json.load(response)
                    outcomes.append("ok")
                except Exception as exc:
                    outcomes.append(type(exc).__name__)
                time.sleep(0.15)
            return {"requested": len(chosen), **pd.Series(outcomes).value_counts().to_dict()}


        probe("sec_companyfacts_20", sec_companyfacts)
        print(json.dumps(report, indent=2, sort_keys=True, default=str))
        PY
