name: runner network probe (temporary)

# Temporary, second round: the first round (16 parallel workers) got HTTP 403
# from api.nasdaq.com after 13 of 200 requests, and every Nasdaq request after
# that was refused; SEC EDGAR was fine.  This round asks whether that was a
# burst limit: a daily-MARK-sized set on a fresh runner first, then one paced
# request per second, then how long a block lasts.
# Runs only when this file changes on the development branch.

on:
  push:
    branches: [dev/kind-pasteur-7fa25i]
    paths: [.github/workflows/runner_network_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Probe paced Nasdaq access from this runner
      run: |
        PYTHONPATH=. python -u - <<'PY'
        import json
        import time
        from datetime import date, datetime, timedelta, timezone
        from urllib.error import HTTPError
        from urllib.parse import urlencode
        from urllib.request import Request, urlopen

        from scripts.research_v5_trend_core_satellite import _nasdaq_dividend_history
        from src.io import nasdaq_update as n
        from src.research import prospective_schedule as schedule

        started = time.monotonic()
        session = schedule.latest_completed_session(datetime.now(timezone.utc))
        end = session.date()
        report = {"runner_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                  "latest_session": end.isoformat()}


        def clock():
            return round(time.monotonic() - started, 1)


        def history(symbol, asset_class="stocks", start=None):
            """One request, exactly as fetch_history builds it; no retries."""
            params = urlencode({
                "assetclass": asset_class,
                "fromdate": (start or end - timedelta(days=n.HISTORY_REQUEST_DAYS)).isoformat(),
                "todate": end.isoformat(), "limit": 5000})
            request = Request(n.uncached(n.API.format(symbol=symbol) + "?" + params),
                              headers=n.HEADERS)
            try:
                with urlopen(request, timeout=30) as response:
                    rows = ((json.load(response).get("data") or {}).get("tradesTable") or {}).get("rows") or []
                return {"status": 200, "rows": len(rows)}
            except HTTPError as exc:
                body = exc.read()[:160].decode("utf-8", "replace").replace("\n", " ")
                return {"status": exc.code, "body": body}
            except Exception as exc:
                return {"status": type(exc).__name__, "body": str(exc)[:160]}


        def guarded(function):
            try:
                return {"ok": True, "value": function()}
            except Exception as exc:
                return {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:200]}


        # A. What one daily MARK needs, sequentially, on a fresh runner.
        mark = {"COMP": history("COMP", "index")}
        mark["QQQ_since_2018"] = history("QQQ", "etf", date(2018, 1, 1))
        for symbol in ["DASH", "ABNB", "AMGN", "PANW", "WDAY"]:
            mark[symbol] = history(symbol)
        mark["QQQ_dividends"] = guarded(lambda: len(_nasdaq_dividend_history()[1]))
        mark["COMP_official_close"] = guarded(
            lambda: n.fetch_closed_index_snapshot("COMP", end).get("close"))
        report["A_mark_sized_sequential"] = mark
        print(json.dumps({"A": mark}, default=str), flush=True)

        # B. Paced: one request per second, until 400 or three refusals in a row.
        params = urlencode({"tableonly": "true", "limit": 10000, "exchange": "nasdaq"})
        with urlopen(Request(n.uncached(n.SCREENER_API + "?" + params), headers=n.HEADERS),
                     timeout=60) as response:
            symbols = [str(row["symbol"]).strip().upper()
                       for row in json.load(response)["data"]["table"]["rows"]]
        sample = symbols[:: max(1, len(symbols) // 400)][:400]
        paced = {"requested": 0, "ok": 0, "first_refusal": None, "statuses": {}}
        refusals_in_row = 0
        for index, symbol in enumerate(sample):
            tick = time.monotonic()
            result = history(symbol)
            paced["requested"] += 1
            key = str(result["status"])
            paced["statuses"][key] = paced["statuses"].get(key, 0) + 1
            if result["status"] == 200:
                paced["ok"] += 1
                refusals_in_row = 0
            else:
                refusals_in_row += 1
                if paced["first_refusal"] is None:
                    paced["first_refusal"] = {"index": index, "symbol": symbol,
                                              "at_seconds": clock(), **result}
                    print(json.dumps({"B_first_refusal": paced["first_refusal"]}), flush=True)
                if refusals_in_row >= 3:
                    break
            if index % 50 == 0:
                print(f"B {index} ok={paced['ok']} t={clock()}", flush=True)
            time.sleep(max(0.0, 1.0 - (time.monotonic() - tick)))
        report["B_paced_1_per_second"] = paced

        # C. If refused: does the block lift after a pause?
        if paced["first_refusal"] is not None:
            recovery = []
            for pause in (60, 180, 300):
                time.sleep(pause)
                recovery.append({"after_pause_seconds": pause, "at_seconds": clock(),
                                 **history("AAPL")})
                print(json.dumps({"C": recovery[-1]}), flush=True)
                if recovery[-1]["status"] == 200:
                    break
            report["C_recovery"] = recovery

        report["total_seconds"] = clock()
        print(json.dumps(report, indent=2, sort_keys=True, default=str))
        PY
