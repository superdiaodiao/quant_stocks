name: schedule script running

on:
  schedule:
    - cron: '30 0 * * *' #北京时间为UTC+8
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: check weekday
      id: weekday-check
      run: |
        DAY_OF_WEEK=$(TZ='Asia/Shanghai' date +%u)
        if [[ "$DAY_OF_WEEK" -eq 7 || "$DAY_OF_WEEK" -eq 1 ]]; then
            echo "今天是周日/周一，不执行脚本。"
            echo "run_scripts=false" >> $GITHUB_ENV
        else
            echo "run_scripts=true" >> $GITHUB_ENV
        fi

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: prepare ta-lib
      if: env.run_scripts == 'true'
      run: |
        wget https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
        tar -xzf ta-lib-0.6.4-src.tar.gz
        cd ta-lib-0.6.4/
        ./configure --prefix=/usr
        make
        sudo make install

        python -m pip install TA-Lib

    - name: install required packages
      if: env.run_scripts == 'true'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: set up git
      if: env.run_scripts == 'true'
      run: |
        git config --global user.email "superdiao6@gmail.com"
        git config --global user.name "superdiaodiao"

    - name: run python script
      if: env.run_scripts == 'true'
      run: |
        python main.py
        python src/opt_params/get_best_rsi_adx.py "placeholder"
