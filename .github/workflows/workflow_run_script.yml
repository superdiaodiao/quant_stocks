name: Fixed Top 3 shadow recommendations

on:
  schedule:
    # 08:30 Asia/Shanghai. Tuesday-Saturday correspond to the preceding
    # US Monday-Friday sessions.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-top3-shadow-recommendations
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes zstd

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Restore verified data release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        scripts/download_data_release.sh

    - name: Generate fixed Top 3 shadow recommendation
      run: |
        PYTHONPATH=. python -m src.research.daily_pipeline --workers 8

    - name: Publish recommendation summary
      if: success()
      run: |
        PYTHONPATH=. python - <<'PY'
        import json
        from pathlib import Path

        root = Path("output/daily/can-slim-top3-v1")
        metadata_path = max(root.glob("recommendations_*.json"))
        metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
        csv_path = metadata_path.with_suffix(".csv")
        lines = [
            "# Fixed Top 3 shadow recommendation",
            "",
            f"- As of: `{metadata['as_of']}`",
            f"- Mode: `{metadata['mode']}`",
            f"- Release status: `{metadata['release_status']}`",
            f"- Recommendations: `{metadata['recommendations']}`",
            "",
            "This workflow produces research recommendations only and cannot place orders.",
        ]
        if csv_path.exists() and csv_path.stat().st_size:
            lines.extend(["", "```csv", csv_path.read_text(encoding="utf-8").strip(), "```"])
        with Path("/tmp/recommendation-summary.md").open("w", encoding="utf-8") as handle:
            handle.write("\n".join(lines))
        PY
        cat /tmp/recommendation-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload shadow recommendation artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fixed-top3-shadow-${{ github.run_id }}
        path: output/daily/can-slim-top3-v1/
        if-no-files-found: error
        retention-days: 30
