name: v50r3 signal watchdog

# Dead-man check for the prospective observation. The r3 ledger is committed
# after every freeze-signal, so this job can decide from the repository alone
# whether the latest month-end SIGNAL window was met. It also re-verifies the
# frozen r3 protocol and its complete code closure. It runs once a day in the
# week before each month end (catching an unfrozen protocol or code drift
# early) and hourly around the month end. A SIGNAL window closes when
# pre-market trading opens on the session after the month end, which a
# weekend or holiday can push to the 4th. Exit 2 (missed window), 3 (protocol
# not frozen or ledger missing), or any validation error fails the job, which
# GitHub reports to the repository owner. It never stages or backfills.

on:
  schedule:
    - cron: "15 12 20-27 * *"
    - cron: "15 * 28-31,1-5 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Check whether a SIGNAL or MARK is due or was missed
      run: |
        PYTHONPATH=. python scripts/research_v50r3_scheduled_run.py check
