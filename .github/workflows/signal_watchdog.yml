name: v50r3 signal watchdog

# Dead-man check for the prospective observation. The r3 ledger lives on the
# live/v50r3 branch (made by the "v50r3 freeze" workflow, or locally by
# scripts/setup_v50r3_live.sh) and
# is pushed after every freeze-signal and mark, so this job reads that branch
# and decides from the repository alone whether the latest month-end SIGNAL
# window was met. A missing live branch means r3 is not frozen yet and fails
# the job like an unfrozen protocol does. It also re-verifies the
# frozen r3 protocol and its complete code closure. It runs hourly around the
# month end and once a day otherwise. A SIGNAL window closes when pre-market
# trading opens on the session after the month end, which a weekend or holiday
# can push to the 4th; a missed month is then caught up in a later session's
# own window, any day until the next month end, so the daily run keeps
# reporting a month that is still owed. Exit 2 (missed window not caught up
# yet), 3 (protocol not frozen or ledger missing), or any validation error
# fails the job, which GitHub reports to the repository owner. It never
# stages, catches up or backfills.

on:
  schedule:
    - cron: "15 12 6-27 * *"
    - cron: "15 * 28-31,1-5 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        ref: live/v50r3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Check whether a SIGNAL or MARK is due or was missed
      run: |
        PYTHONPATH=. python scripts/research_v50r3_scheduled_run.py check

    - name: Check that the marks keep up
      run: |
        # The scheduler ends a run whose closes are not published yet with a
        # warning; this fails once the marks fall more than two sessions behind.
        PYTHONPATH=. python scripts/v50r3_mark_freshness.py
