name: v50r3 scheduler

# Runs the v50r3 prospective observation on GitHub-hosted runners. Every half
# hour it checks out the pinned live/v50r3 branch (made by the "v50r3 freeze"
# workflow) and asks the r3 scheduler what is due. When a SIGNAL or MARK is
# due it restores the data release and runs it; the scheduler commits the
# ledger with the new signal, the sourced-event supplement and the latest
# valued bundle, and pushes live/v50r3. Every run starts on a fresh machine:
# what a later run needs travels in git, not in a cache. GitHub starts
# scheduled runs late, by hours at busy times, so the "v50r3 window waker"
# also dispatches this workflow when a SIGNAL window opens.
#
# Nasdaq refuses bursts from GitHub's runners (16 parallel requests got HTTP
# 403 after 13 on 2026-09-25; one at a time, 400 of 400 succeeded), so prices
# are downloaded one at a time. A SIGNAL then takes about 2.5-3 hours, inside
# its window of 11 hours or more; a MARK takes minutes.
#
# Before the freeze live/v50r3 does not exist and the job skips. Nasdaq
# publishes a session's rows four to five hours after the close; until then a
# due SIGNAL or MARK is skipped with a notice (scripts/v50r3_sources_ready.py),
# and a close still missing after that ends a run with a warning; a SIGNAL
# queues its retry at once with a workflow_dispatch, a MARK waits for the next
# scheduled run. A run held by a few named stocks without a close (a halt)
# also ends with a warning, but a retry would fail the same way: a later
# SIGNAL for that session waits until those closes are published, and only
# one retry is made (scripts/v50r3_notify.py --still-blocked). A split-like
# move that needs a sourced event, a run while a missed month is still owed
# (exit 2), or any other error fails the job; between runs the "v50r3 signal
# watchdog" keeps reporting a month that is owed.
#
# Each SIGNAL and MARK is reported on the observation log issue (and by email
# when configured): a frozen signal or an appended mark, and a held, missed or
# failed run with what to do about it, once a week at most. GitHub itself
# emails a failure only to whoever triggered the run, and the runs that the
# window waker or a retry start are the bot's.

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

env:
  # The observation log issue that the notifier reports on.
  NOTIFY_ISSUE: "2"

concurrency:
  group: v50r3-scheduler
  cancel-in-progress: false

jobs:
  live-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
    - id: probe
      run: |
        if git ls-remote --exit-code --heads \
            "https://github.com/${{ github.repository }}.git" live/v50r3 >/dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::live/v50r3 does not exist yet: v50r3 is not frozen."
        fi

  run:
    needs: live-branch
    if: needs.live-branch.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
    - uses: actions/checkout@v5
      with:
        ref: live/v50r3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Fetch the notifier from master
      # It reports each run and says whether a held SIGNAL may run again; it
      # lives on master, and live/v50r3 stays pinned.
      continue-on-error: true
      run: |
        git fetch --quiet --depth 1 origin master
        git show FETCH_HEAD:scripts/v50r3_notify.py > "$RUNNER_TEMP/notify.tmp"
        mv "$RUNNER_TEMP/notify.tmp" "$RUNNER_TEMP/v50r3_notify.py"

    - name: Decide what is due
      id: due
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        PYTHONPATH=. python scripts/research_v50r3_scheduled_run.py check > decision.json
        code=$?
        set -e
        cat decision.json
        # 0 nothing missed; 2 a missed month (its catch-up may be due now).
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
        action=$(python -c "import json; print(json.load(open('decision.json'))['action'])")
        as_of=$(python -c "import json; print(json.load(open('decision.json')).get('as_of') or '')")
        if [ "$action" = "RUN_SIGNAL" ] || [ "$action" = "RUN_MARK" ]; then
          # Nasdaq publishes a session's rows hours after the close; a run
          # started before that fails after its downloads.
          set +e
          PYTHONPATH=. python scripts/v50r3_sources_ready.py --as-of "$as_of" > sources.json
          published=$?
          set -e
          cat sources.json
          if [ "$published" -eq 1 ]; then
            echo "::notice::Nasdaq has not published the $as_of session yet; a later run retries."
            action="WAIT_FOR_PUBLISHED_SESSION"
          elif [ "$published" -ne 0 ]; then
            exit "$published"
          fi
        fi
        if [ "$action" = "RUN_SIGNAL" ] && [ -s "$RUNNER_TEMP/v50r3_notify.py" ]; then
          # A SIGNAL held by stocks without a close (a halt) would fail the
          # same way, two and a half hours later, until they are published.
          set +e
          PYTHONPATH=. python "$RUNNER_TEMP/v50r3_notify.py" --still-blocked --as-of "$as_of" \
            > held.json
          held=$?
          set -e
          cat held.json
          # 10: still held; anything else (a crash too) lets the SIGNAL run.
          if [ "$held" -eq 10 ]; then
            echo "::notice::The $as_of SIGNAL waits for the closes that held it; a later run checks again."
            action="WAIT_FOR_MISSING_CLOSES"
          fi
        fi
        echo "action=$action" >> "$GITHUB_OUTPUT"
        echo "check_exit=$code" >> "$GITHUB_OUTPUT"

    - name: Restore the data release
      if: steps.due.outputs.action == 'RUN_SIGNAL' || steps.due.outputs.action == 'RUN_MARK'
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/v50r3_restore_data.sh

    - name: Run the due SIGNAL or MARK
      id: run
      if: steps.due.outputs.action == 'RUN_SIGNAL' || steps.due.outputs.action == 'RUN_MARK'
      env:
        ACTION: ${{ steps.due.outputs.action }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        set +e
        PYTHONPATH=. python scripts/research_v50r3_scheduled_run.py run --push --workers 1 \
          > run.json 2> run.log
        code=$?
        set -e
        cat run.json
        tail -n 80 run.log
        if [ "$code" -eq 0 ]; then
          echo "result=done" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$code" -eq 2 ]; then
          echo "result=missed" >> "$GITHUB_OUTPUT"
          echo "::error::A SIGNAL window was missed and the month is not caught up yet."
          exit 2
        fi
        # Inputs not published yet: the next run retries. A move that needs a
        # sourced event, or anything else, fails the job.
        if grep -Eq "is not ready|Retry once the closes are published|official index market is not closed" run.log \
            && ! grep -Eq "split_like_moves_explained|Unresolved corporate action" run.log; then
          held=""
          if [ -s "$RUNNER_TEMP/v50r3_notify.py" ]; then
            held=$(python "$RUNNER_TEMP/v50r3_notify.py" --blocked-by run.log || true)
          fi
          if [ "$held" = "blocked" ]; then
            # A few named stocks have no close (a halt): a retry now would
            # fail the same way. The report names them; a later SIGNAL for
            # this session runs once they are published.
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::Named stocks without a close held this run; see the report on issue $NOTIFY_ISSUE."
            exit 0
          fi
          echo "result=not_ready" >> "$GITHUB_OUTPUT"
          echo "::warning::Inputs are not ready yet; a later run retries."
          if [ "$ACTION" = "RUN_SIGNAL" ]; then
            # Scheduled runs start late and irregularly here, and the window
            # has room for few attempts: queue the retry now.
            gh workflow run v50r3_scheduler.yml --ref master \
              || echo "::warning::Could not queue a retry; a scheduled run retries."
          fi
          exit 0
        fi
        echo "result=failed" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Report the result
      # Also after a failure: GitHub emails nobody about a failed run that the
      # window waker or a retry started.
      if: always() && (steps.due.outputs.action == 'RUN_SIGNAL' || steps.due.outputs.action == 'RUN_MARK')
      continue-on-error: true
      env:
        # A comment on the observation log issue, which GitHub sends to its
        # subscribers; and an email when the MAIL_USERNAME and MAIL_PASSWORD
        # repository secrets exist (MAIL_SERVER and MAIL_PORT repository
        # variables default to Gmail).
        GH_TOKEN: ${{ github.token }}
        ACTION: ${{ steps.due.outputs.action }}
        RESULT: ${{ steps.run.outputs.result }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        MAIL_SERVER: ${{ vars.MAIL_SERVER }}
        MAIL_PORT: ${{ vars.MAIL_PORT }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ ! -s "$RUNNER_TEMP/v50r3_notify.py" ]; then
          echo "::warning::The notifier could not be fetched from master: nothing reported."
          exit 0
        fi
        # A run that died before reading its result counts as failed.
        python "$RUNNER_TEMP/v50r3_notify.py" --result "${RESULT:-failed}" --action "$ACTION" \
          --decision run.json --check decision.json --log run.log --root .
