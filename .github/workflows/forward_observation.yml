name: Forward observation

# Manual dry run of scripts/forward_observation.py for the frozen candidates of
# docs/forward_observation_checklist.md section B (S3-Yb, QQQ RSI2-dip SEL-A/SEL-P,
# S-MISP short overlay): it prints the log the runner would write and commits nothing.
# Its monthly schedule (first days of the month) was folded into
# forward_observation_daily.yml on 2026-10-19: that workflow runs the same runner every
# trading day, finalises a month on the first session of the next one exactly as this
# job did, checks the observation's health each day, and is the only writer of the log
# and the state (a write here would change the log without health.json and the replay
# state). Both share one concurrency group; a waiting run of this file is cancelled when
# another run queues behind it. S/P top-10 is not here, because it needs the owner's
# QuantConnect session.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-observation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Restore raw-data cache
      uses: actions/cache/restore@v4
      with:
        path: .cache
        key: forward-obs-manual-${{ github.run_id }}
        restore-keys: forward-obs-

    - name: Run the observation (dry run)
      env:
        FORWARD_OBS_CACHE: .cache
        ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
        ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      run: |
        args="--fetch --fetch-smisp --dry-run"
        PYTHONPATH=. python scripts/forward_observation.py $args
