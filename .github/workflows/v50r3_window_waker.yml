name: v50r3 window waker

# GitHub starts scheduled runs late, by hours at busy times (in this
# repository a 00:30 UTC schedule started around 03:45 every day, and a 12:15
# UTC one at 17:11), so the half-hourly "v50r3 scheduler" trigger cannot be
# counted on to start a SIGNAL soon after Nasdaq publishes the session, four
# to five hours after the close. On weekday evenings this checks whether a
# SIGNAL (a month end, or the catch-up of a missed one) is due in the open
# window or today's; if so it waits until the window is open and Nasdaq has
# published the session (scripts/v50r3_sources_ready.py), checking every ten
# minutes, and starts the scheduler with a workflow_dispatch, which GitHub
# runs at once. A run out of time leaves the wait to a later one. The
# scheduler's own schedule still retries SIGNALs and runs the marks.

on:
  schedule:
    - cron: "7 19 * * 1-5"
    - cron: "7 21 * * 1-5"
    - cron: "7 23 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: v50r3-window-waker
  cancel-in-progress: false

jobs:
  live-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
    - id: probe
      run: |
        if git ls-remote --exit-code --heads \
            "https://github.com/${{ github.repository }}.git" live/v50r3 >/dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::live/v50r3 does not exist yet: v50r3 is not frozen."
        fi

  wake:
    needs: live-branch
    if: needs.live-branch.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - uses: actions/checkout@v5
      with:
        ref: live/v50r3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Wait for a published SIGNAL session and start the scheduler
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: PYTHONPATH=. python scripts/v50r3_window_waker.py
